version: '3'
services:
  #服务名
  llmops-ui:
    #镜像名
    image: llmops-ui:0.1.0
    build:
      context: ../llmops-ui
      dockerfile: Dockerfile
    #容器名
    container_name: llmops-ui
    #启动docker服务时自动启动容器
    restart: always
    environment: [ ]
    ports:
      - "3000:3000"
  llmops-api:
    image: llmops-api:0.1.0  #镜像名
    build:  #找不到镜像时的构建路径
      context: ../llmops-api #上一层目录的llmops-api文件夹
      dockerfile: Dockerfile
    container_name: llmops-api #容器名
    restart: always
    volumes:
      # 将容器的日志数据/app/api/storage挂载到本地/opt/app/storage上，防止数据丢失
      - /opt/app/storage:/app/api/storage
    environment:
      # 模式为API，代表启用API服务
      MODE: api
      SERVER_WORKER_AMOUNT: 1  #worker进程数量
      SERVER_THREAD_AMOUNT: 4  #每个进程下有4个线程
      # 数据库迁移配置
      MIGRATION_ENABLED: 'true'
      # JWT加密秘钥
      JWT_SECRET_KEY: O2QrSHowj3kGqdh0UBztEZAD6bpTPNRx
      # CSRF校验开关
      WTF_CSRF_ENABLED: 'false'
      # SQLAlchemy数据库配置
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:llmops123456@llmops-db:5432/llmops?client_encoding=utf-8
      SQLALCHEMY_POOL_SIZE: 30
      SQLALCHEMY_POOL_RECYCLE: 3600
      SQLALCHEMY_ECHO: 'false'  #是否将 SQLAlchemy 生成的 SQL 语句和数据库执行信息打印到控制台（日志）中
      # Redis缓存数据库配置
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: llmops123456
      REDIS_DB: 0
      REDIS_USE_SSL: 'false'
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: llmops-weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: llmops-weaviate
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ftBC9hKkjfdbdi0wW3T6kEtMh5BZFpGa1DF8
      # 腾讯云COS对象存储
      COS_SECRET_ID: AKIDUpyu7A2tfGn7EAvTs67ydGi062mLisqd
      COS_SECRET_KEY: d8QWQ7GDxVtAF7qOlvtgIk0hQ6hZr1zk
      COS_REGION: ap-guangzhou
      COS_SCHEME: https
      COS_BUCKET: imooc-llmops-1259388149
      COS_DOMAIN: ''
      # Celery异步队列任务配置
      CELERY_BROKER_DB: 1
      CELERY_RESULT_BACKEND_DB: 1
      CELERY_TASK_IGNORE_RESULT: 'true' #异步任务出现错误时忽略错误，保证进程不被中断
      CELERY_RESULT_EXPIRES: 3600
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: Ov23liLFWussK3TpWZOR
      GITHUB_CLIENT_SECRET: f5f04da7d5e572ad0b7b70ce5e0da0b250e9de57
      GITHUB_REDIRECT_URI: https://yunwangluokeji.icu/auth/authorize/github #交给github去识别
      # LangSmith配置
