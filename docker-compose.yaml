      # OpenAI服务提供者
      OPENAI_API_KEY: sk-400df849549544b383f36eef942ad98c
      OPENAI_API_BASE: https://api.deepseek.com/v1
      # 百度千帆服务提供者
      QIANFAN_API_KEY: bce-v3/ALTAK-t4NTjh5x6DqFxu4Vr08OU/ff94699fd19cbd33eb067ef56a868a6771ebf701
      QIANFAN_BASE_URL: https://qianfan.baidubce.com/v2/
      # 通义千问服务提供者
      DASHSCOPE_API_KEY: sk-ws-H.PHRLERD.2SGl.MEYCIQCuP9udcB1AVXSiSGj2VaprPM06J4rcebdJQYYbMcNdzgIhAM-f3k2Q_3CJcGqT9Unwz1OFIHbX1zpH2mDEQYICXBz3
      # 高德工具API秘钥
      GAODE_API_KEY: f9deca1f4cc388e484d290e26d8c8aa3
